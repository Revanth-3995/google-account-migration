name: Render Keep Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL is not configured"
            exit 1
          fi

          echo "workflow_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "target_url=$RENDER_HEALTH_URL"

          curl -L --fail-with-body \
            --connect-timeout 15 \
            --max-time 90 \
            -w "\nHTTP_STATUS=%{http_code}\nTIME=%{time_total}\n" \
            "$RENDER_HEALTH_URL"
